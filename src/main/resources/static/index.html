<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>千万别散伙：AI 奇葩团队生存战</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f4f1ea;
      background-image: radial-gradient(#d6d0c4 1px, transparent 1px);
      background-size: 16px 16px;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pixel-box {
      border: 2px solid #0f172a;
      box-shadow: 4px 4px 0px #0f172a;
    }
    .pixel-btn {
      border: 2px solid #0f172a;
      box-shadow: 2px 2px 0px #0f172a;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .pixel-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #0f172a;
    }
    .pulse-danger { animation: pulseDanger 1s infinite; }
    @keyframes pulseDanger {
      0%, 100% { background-color: #fee2e2; }
      50% { background-color: #fecaca; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const AVATAR_EMOJI = {
      grumpy_coder: "👨‍💻", dreamer_pm: "📊", chill_designer: "🎨", fortune_architect: "🔮",
      coffee_intern: "🧋", civil_exam_dev: "📚", hype_ops: "📢", strict_qa: "🔍",
      boss_relative: "🕶️", ai_bro: "🤖", startup_sales: "💼", client_boss: "🧐", default: "🧑"
    };

    const ACTION_LABELS = {
      OVERTIME_WORK: "🔥 通宵赶工", SLACK_OFF: "🐟 带薪摸鱼", GOSSIP_IN_GROUP: "💬 群里传话",
      RESIGN: "📦 提桶跑路", PITCH_IDEA: "💡 又画新饼", DELIVER_UI: "✨ 交付设计",
      ASK_LEAVE: "🏥 请假逃避", BLESS_SERVER: "🕯️ 玄学祈福", BREAK_PROD: "💥 误删测试库",
      BOOST_MORALE: "🎉 鼓舞士气", BLOCK_RELEASE: "⛔ 卡死上线", VERIFY_FIX: "✅ 验收通过",
      REPORT_TO_BOSS: "📞 打小报告", BRING_BUDGET: "💰 拉来预算", CHANGE_SCOPE: "📝 临时改需求",
      FINAL_SIGN_OFF: "🏆 终极签字验收"
    };

    
    const CARD_DECK = [
      { id: "CARD_PIE", name: "🥧 画大饼", cost: "¥0", desc: "进度+10% 压力+10 (Combo: 后接发红包)", tag: "常规" },
      { id: "CARD_RED_PACKET", name: "💸 发红包", cost: "¥1000", desc: "压力-25 信任+15 进度+6%", tag: "常规" },
      { id: "CARD_ICED_COFFEE", name: "🧋 全员冰美式", cost: "¥400", desc: "压力-15 进度+8%", tag: "续命" },
      { id: "CARD_FORTUNE", name: "🔮 算一卦再上线", cost: "¥0", desc: "50%进度+24% / 50%全员压力+18", tag: "非常规" },
      { id: "CARD_UNPLUG_NET", name: "🧹 物理拔网线", cost: "¥500", desc: "强行清空谣言传话 压力-15", tag: "非常规" },
      { id: "CARD_BOSS_INSPECT", name: "🕵️ 假装老板视察", cost: "¥0", desc: "进度+18% 信任-15 (Combo: 后接冰美式)", tag: "非常规" },
      { id: "CARD_DROP_DB", name: "🔥 高危热更新", cost: "¥0", desc: "进度+28% 但目标压力暴涨+35", tag: "赌命" }
    ];

    const CRISIS_POOL = [
      {
        title: "🔥 突发危机：测试服务器突然 502 崩溃！",
        desc: "距离演示只剩半天，日志显示内存溢出，全组人都在群里艾特你。",
        options: [
          { label: "💸 紧急升配云主机（经费 -2000，进度 +12%）", deltas: { budget: -2000, progress: 12 } },
          { label: "🛠️ 咬牙自己回滚版本（不花钱，但进度 -5%）", deltas: { progress: -5 } }
        ]
      },
      {
        title: "📢 甲方突袭：要求首页加个炫酷 3D 动效！",
        desc: "客户刚在微信上发了一张竞品截图，说'这个看着大气，加上吧'。",
        options: [
          { label: "🤝 顺水推舟加钱接单（经费 +3000，进度 +5%）", deltas: { budget: 3000, progress: 5 } },
          { label: "🛡️ 硬气拒绝保护团队（经费不变，进度 +10%）", deltas: { progress: 10 } }
        ]
      },
      {
        title: "☕ 下午茶续命时刻",
        desc: "连续赶工两天，团队气氛已经降到冰点。",
        options: [
          { label: "🧋 全员点波霸奶茶（经费 -800，进度 +10%）", deltas: { budget: -800, progress: 10 } },
          { label: "📖 群里发鸡汤励志文章（不花钱，进度 +3%）", deltas: { progress: 3 } }
        ]
      }
    ];

    function playBeep(freq = 520, duration = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function PixelOfficeStage({ npcs, npcStates, lastActionMap, selectedNpcId, progress, fxTrigger }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let frame = 0;
        let raf;

        const COLORS = ["#0284c7", "#9333ea", "#059669", "#d97706", "#db2777"];
        const particles = [];
        if (fxTrigger?.ts) {
          const isCoin = fxTrigger.type === "COIN";
          for (let i = 0; i < 28; i++) {
            particles.push({
              x: Math.random() * 460 + 10,
              y: isCoin ? -Math.random() * 40 : 60 + Math.random() * 20,
              vx: (Math.random() - 0.5) * 2.5,
              vy: isCoin ? 1.5 + Math.random() * 2 : -1.5 - Math.random() * 2,
              size: isCoin ? 6 : 4,
              color: isCoin ? (i % 2 === 0 ? "#facc15" : "#fb923c") : "#ef4444",
              life: 65
            });
          }
        }

        const drawRect = (x, y, w, h, color) => {
          ctx.fillStyle = color;
          ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        };

        const render = () => {
          frame++;
          ctx.imageSmoothingEnabled = false;
          // Bright daytime Kairosoft office wall & warm wood floor
          drawRect(0, 0, 480, 86, "#fef3c7");
          drawRect(0, 86, 480, 34, "#d6d3d1");
          drawRect(0, 84, 480, 2, "#0f172a");

          // Daytime window with blue sky & pixel clouds
          drawRect(18, 10, 76, 44, "#0f172a");
          drawRect(20, 12, 72, 40, "#38bdf8");
          drawRect(72, 16, 12, 12, "#fde047"); // sun
          const cx = 26 + Math.floor((frame * 0.2) % 36);
          drawRect(cx, 22, 18, 6, "#ffffff");
          drawRect(cx + 4, 18, 10, 4, "#ffffff");

          // Progress scoreboard on wall
          drawRect(356, 12, 108, 24, "#0f172a");
          drawRect(358, 14, 104, 20, "#ffffff");
          drawRect(360, 16, Math.min(100, Math.round(progress)), 16, progress >= 99 ? "#f59e0b" : "#10b981");

          const count = Math.min(5, npcs.length);
          const spacing = 420 / Math.max(1, count);

          npcs.slice(0, 5).forEach((npc, idx) => {
            const st = npcStates?.[npc.npcId];
            const active = st ? st.active : true;
            const pressure = st?.stats?.pressure ?? 20;
            const action = lastActionMap?.[npc.npcId] || "";
            const baseX = 48 + idx * spacing;
            const baseY = 62;
            const bob = active ? (Math.floor(frame / 15 + idx) % 2) * 2 : 0;
            const shirt = COLORS[idx % COLORS.length];
            const isSel = npc.npcId === selectedNpcId;

            // Desk & Monitor
            drawRect(baseX - 18, baseY + 18, 48, 16, "#92400e");
            drawRect(baseX - 10, baseY + 4, 24, 14, "#1e293b");
            drawRect(baseX - 8, baseY + 6, 20, 10, active ? (frame % 20 < 10 ? "#7dd3fc" : "#bae6fd") : "#475569");

            if (!active) {
              drawRect(baseX + 12, baseY + 10, 14, 10, "#d97706");
              drawRect(baseX + 12, baseY + 10, 14, 2, "#78350f");
              return;
            }

            if (isSel) {
              drawRect(baseX + 2, baseY - 24 + bob, 6, 4, "#ef4444");
              drawRect(baseX + 4, baseY - 20 + bob, 2, 2, "#ef4444");
            }

            drawRect(baseX - 2, baseY - 12 + bob, 14, 12, "#fed7aa");
            drawRect(baseX - 2, baseY - 14 + bob, 14, 4, "#0f172a");
            drawRect(baseX + 1, baseY - 7 + bob, 2, 2, "#0f172a");
            drawRect(baseX + 7, baseY - 7 + bob, 2, 2, "#0f172a");
            drawRect(baseX - 4, baseY + bob, 18, 16, shirt);

            if (action === "OVERTIME_WORK" || action === "DELIVER_UI" || action === "VERIFY_FIX") {
              const sy = (frame % 12) * 1.5;
              drawRect(baseX - 12, baseY + 2 - sy, 3, 3, "#f59e0b");
              drawRect(baseX + 16, baseY + 4 - sy, 3, 3, "#0284c7");
            } else if (action === "SLACK_OFF" || action === "ASK_LEAVE") {
              const zy = (frame % 24) * 0.6;
              ctx.fillStyle = "#475569";
              ctx.font = "bold 9px monospace";
              ctx.fillText("Zzz", baseX + 14, baseY - 8 - zy);
            } else if (action === "GOSSIP_IN_GROUP" || action === "PITCH_IDEA") {
              drawRect(baseX + 12, baseY - 16, 12, 9, "#ffffff");
              drawRect(baseX + 16, baseY - 14, 2, 4, "#ef4444");
            }

            if (pressure >= 80 && frame % 16 < 10) {
              drawRect(baseX + 14, baseY - 14 + bob, 4, 8, "#ef4444");
              drawRect(baseX + 14, baseY - 4 + bob, 4, 3, "#ef4444");
            }

            ctx.fillStyle = isSel ? "#b91c1c" : "#0f172a";
            ctx.font = "bold 9px monospace";
            ctx.fillText(npc.name.slice(0, 4), baseX - 6, 114);
          });

          for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.life--;
            drawRect(pt.x, pt.y, pt.size, pt.size, pt.color);
            if (pt.life <= 0 || pt.y > 125) particles.splice(i, 1);
          }

          raf = requestAnimationFrame(render);
        };
        raf = requestAnimationFrame(render);
        return () => cancelAnimationFrame(raf);
      }, [npcs, npcStates, lastActionMap, selectedNpcId, progress, fxTrigger]);

      return (
        <div className="p-2 bg-amber-50 border-b-2 border-slate-900">
          <canvas ref={canvasRef} width={480} height={120} className="w-full h-28 border-2 border-slate-900 rounded-lg" style={{ imageRendering: "pixelated" }} />
        </div>
      );
    }

    function App() {
      const [levels, setLevels] = useState([]);
      const [customIdea, setCustomIdea] = useState("");
      const [compiling, setCompiling] = useState(false);
      const [session, setSession] = useState(null);
      const [selectedNpcId, setSelectedNpcId] = useState(null);
      const [chatLogs, setChatLogs] = useState({});
      const [eventLogs, setEventLogs] = useState([]);
      const [inputText, setInputText] = useState("");
      const [sending, setSending] = useState(false);
      const [toast, setToast] = useState(null);
      const [expandedThoughts, setExpandedThoughts] = useState({});
      const [crisis, setCrisis] = useState(null);
      const [lastActionMap, setLastActionMap] = useState({});
      const [fxTrigger, setFxTrigger] = useState(null);
      const [hand, setHand] = useState(() => CARD_DECK.slice(0, 4));
      const [intentMap, setIntentMap] = useState({});
      const [quickReplies, setQuickReplies] = useState([
        { label: "画饼安抚", text: "辛苦了，项目上线后请你吃大餐，今晚加把劲！" },
        { label: "务实推进", text: "先别管那个新需求了，按最稳的方案先上线。" },
        { label: "夸赞鼓劲", text: "刚听说隔壁组都在夸你效率高，核心模块靠你了！" }
      ]);
      const chatEndRef = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        fetch("/api/levels")
          .then(r => r.json())
          .then(data => {
            const filtered = data.filter(l => l.gameType === "TEAM_SURVIVAL");
            setLevels(filtered.length > 0 ? filtered : data);
          })
          .catch(e => showToast("无法连接后端服务：" + e.message));
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatLogs, selectedNpcId]);

      const startLevel = async (levelId) => {
        try {
          const res = await fetch(`/api/session/start?levelId=${encodeURIComponent(levelId)}`, { method: "POST" });
          if (!res.ok) throw new Error("启动对局失败");
          const data = await res.json();
          setSession(data);
          setSelectedNpcId(data.levelConfig.npcs[0]?.npcId || null);
          setChatLogs({});
          setLastActionMap({});
          setIntentMap({});
          setHand([...CARD_DECK].sort(() => Math.random() - 0.5).slice(0, 4));
          setCrisis(null);
          setEventLogs([`📅 第 1 天打卡上班！目标：在 ${data.levelConfig.maxTurns} 天内把项目进度推到 100%。`]);
        } catch (e) {
          showToast(e.message);
        }
      };

      const handleCompileCustom = async () => {
        if (!customIdea.trim()) return showToast("请先输入一句项目脑洞！");
        setCompiling(true);
        try {
          const res = await fetch("/api/levels/compile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ gameType: "TEAM_SURVIVAL", idea: customIdea.trim() })
          });
          if (!res.ok) throw new Error("生成失败，请检查 LLM_API_KEY");
          const compiled = await res.json();
          setLevels(prev => [compiled, ...prev]);
          setCustomIdea("");
          await startLevel(compiled.levelId);
        } catch (e) {
          showToast(e.message);
        } finally {
          setCompiling(false);
        }
      };

      const triggerManagerAction = async (actionType, customDeltas = null) => {
        if (!session || session.status !== "RUNNING") return;
        playBeep(660, 0.08);
        try {
          const res = await fetch("/api/session/action", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: session.sessionId, actionType, targetNpcId: selectedNpcId, customDeltas })
          });
          const data = await res.json();
          if (data.session) setSession(data.session);
          if (data.log) setEventLogs(prev => [data.log, ...prev]);
          if (actionType === "RED_PACKET" || actionType === "TEAM_DINNER") {
            setFxTrigger({ type: "COIN", ts: Date.now() });
            playBeep(880, 0.08);
            setTimeout(() => playBeep(1174, 0.12), 70);
          }
          setCrisis(null);
        } catch (e) {
          showToast("操作失败：" + e.message);
        }
      };

      
      const playCard = async (card) => {
        if (!session || !selectedNpcId || sending || session.status !== "RUNNING") return;
        const targetNpc = session.levelConfig.npcs.find(n => n.npcId === selectedNpcId);
        setSending(true);
        try {
          const res = await fetch("/api/session/play-card", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: session.sessionId, cardId: card.id, targetNpcId: selectedNpcId, note: inputText.trim() })
          });
          const data = await res.json();
          if (data.session) setSession(data.session);
          if (data.cardLog) setEventLogs(prev => [data.cardLog, ...prev]);
          if (data.comboMsg) {
            setEventLogs(prev => [data.comboMsg, ...prev]);
            setFxTrigger({ type: "COIN", ts: Date.now() });
            playBeep(987, 0.12);
          }
          if (data.decision) {
            setChatLogs(prev => ({
              ...prev,
              [selectedNpcId]: [
                ...(prev[selectedNpcId] || []),
                { role: "player", text: `🃏 出牌【${card.name}】${inputText.trim() ? "：" + inputText.trim() : ""}` },
                {
                  role: "npc",
                  npcName: targetNpc?.name,
                  text: data.decision.dialogue,
                  thought: data.decision.thought,
                  action: data.validation?.executedAction || data.decision.intentAction,
                  overridden: data.validation?.actionOverridden,
                  overrideReason: data.validation?.overrideReason
                }
              ]
            }));
            setLastActionMap(prev => ({ ...prev, [selectedNpcId]: data.validation?.executedAction || data.decision.intentAction }));
            if (data.decision.nextTurnIntent) {
              setIntentMap(prev => ({ ...prev, [selectedNpcId]: data.decision.nextTurnIntent }));
            }
          }
          setInputText("");
          setHand([...CARD_DECK].sort(() => Math.random() - 0.5).slice(0, 4));
          if (data.session?.status === "RUNNING" && data.session.currentTurn % 2 === 1) {
            setCrisis(CRISIS_POOL[Math.floor(Math.random() * CRISIS_POOL.length)]);
          }
        } catch (e) {
          showToast("出牌失败：" + e.message);
        } finally {
          setSending(false);
        }
      };

      const sendMessage = async (textOverride) => {
        const msg = (textOverride ?? inputText).trim();
        if (!msg || !session || !selectedNpcId || sending || session.status !== "RUNNING") return;

        const targetNpc = session.levelConfig.npcs.find(n => n.npcId === selectedNpcId);
        setSending(true);
        if (!textOverride) setInputText("");

        setChatLogs(prev => ({
          ...prev,
          [selectedNpcId]: [...(prev[selectedNpcId] || []), { role: "player", text: msg }]
        }));

        try {
          const res = await fetch("/api/session/interact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: session.sessionId, targetNpcId: selectedNpcId, message: msg, sensors: null })
          });
          if (!res.ok) throw new Error("大模型调用失败，请检查后端 API Key");
          const data = await res.json();
          if (data.session) setSession(data.session);

          const { decision, validation } = data;
          if (decision) {
            playBeep(480, 0.06);
            setChatLogs(prev => ({
              ...prev,
              [selectedNpcId]: [
                ...(prev[selectedNpcId] || []),
                {
                  role: "npc",
                  npcName: targetNpc?.name,
                  text: decision.dialogue,
                  thought: decision.thought,
                  action: validation?.executedAction || decision.intentAction,
                  overridden: validation?.actionOverridden,
                  overrideReason: validation?.overrideReason
                }
              ]
            }));

            const logsToAdd = [];
            const actionLabel = ACTION_LABELS[validation?.executedAction] || validation?.executedAction;
            logsToAdd.push(`第 ${session.currentTurn} 天 · ${targetNpc?.name} 执行【${actionLabel}】`);
            if (validation?.actionOverridden && validation?.overrideReason) logsToAdd.push(`⚠️ 规则拦截：${validation.overrideReason}`);
            if (decision.rumorToShare?.content) logsToAdd.push(`🤫 暗流涌动：${targetNpc?.name} 私下给队友传了话`);
            setEventLogs(prev => [...logsToAdd, ...prev]);

            setLastActionMap(prev => ({ ...prev, [selectedNpcId]: validation?.executedAction || decision.intentAction }));
            if (decision.suggestedReplies?.length) setQuickReplies(decision.suggestedReplies);
            if (data.session?.status === "RUNNING" && data.session.currentTurn % 2 === 1) {
              setCrisis(CRISIS_POOL[Math.floor(Math.random() * CRISIS_POOL.length)]);
            }
          }
        } catch (e) {
          showToast(e.message);
        } finally {
          setSending(false);
        }
      };

      if (!session) {
        return (
          <div className="max-w-5xl mx-auto px-4 py-10">
            {toast && <div className="fixed top-4 right-4 z-50 px-4 py-3 rounded-lg bg-red-600 text-white text-sm pixel-box">{toast}</div>}
            <div className="text-center mb-8">
              <span className="inline-block px-3 py-1 rounded-full bg-amber-300 text-slate-900 border-2 border-slate-900 text-xs font-bold mb-3">
                ☀️ 开罗像素职场 · AI NPC 生存模拟
              </span>
              <h1 className="text-4xl font-black text-slate-900 mb-2">💼 千万别散伙：AI 奇葩团队生存战</h1>
              <p className="text-slate-600 font-medium">发红包、搞团建、应对突发危机，稳住这帮奇葩同事按时交付！</p>
            </div>

            <div className="bg-amber-100 rounded-xl p-6 mb-8 pixel-box">
              <h2 className="text-lg font-extrabold text-slate-900 mb-1">✨ AI 一句话自编奇葩项目</h2>
              <p className="text-xs text-slate-600 mb-3">输入任意脑洞项目，自动生成团队阵容与规则：</p>
              <div className="flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={customIdea}
                  onChange={e => setCustomIdea(e.target.value)}
                  placeholder="例如：3天内做出一个给猫咪相亲的社交 App，预算只有 5000 块"
                  className="flex-1 bg-white border-2 border-slate-900 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:outline-none"
                />
                <button
                  onClick={handleCompileCustom}
                  disabled={compiling}
                  className="px-6 py-2.5 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-bold text-sm pixel-btn disabled:opacity-50"
                >
                  {compiling ? "AI 编剧中..." : "生成剧本并开局"}
                </button>
              </div>
            </div>

            <h2 className="text-lg font-extrabold text-slate-900 mb-4">🎯 选择工作剧本（共 {levels.length} 关）</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {levels.map(lvl => (
                <div key={lvl.levelId} className={`rounded-xl p-5 flex flex-col justify-between pixel-box ${lvl.hellMode ? "bg-rose-100" : "bg-white"}`}>
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs px-2 py-0.5 rounded bg-slate-900 text-amber-300 font-bold">{lvl.maxTurns} 天期限</span>
                      <span className="text-xs font-bold text-slate-600">{lvl.npcs?.length} 人小组</span>
                    </div>
                    <h3 className="text-base font-black text-slate-900 mb-2">{lvl.title}</h3>
                    <p className="text-xs text-slate-600 mb-3 leading-relaxed">{lvl.description}</p>
                    <div className="flex flex-wrap gap-1.5 mb-4">
                      {lvl.npcs?.map(n => (
                        <span key={n.npcId} className="text-xs px-2 py-0.5 rounded bg-amber-50 text-slate-800 border border-slate-900 font-medium">
                          {AVATAR_EMOJI[n.avatarTag] || "🧑"} {n.name}
                        </span>
                      ))}
                    </div>
                  </div>
                  <button
                    onClick={() => startLevel(lvl.levelId)}
                    className="w-full py-2 rounded-lg bg-amber-300 hover:bg-amber-200 text-slate-900 font-bold text-sm pixel-btn"
                  >
                    打卡接手项目
                  </button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const cfg = session.levelConfig;
      const progress = session.globalStats?.progress ?? 0;
      const budget = session.globalStats?.budget ?? 0;
      const activeNpc = cfg.npcs.find(n => n.npcId === selectedNpcId);
      const activeNpcState = session.npcStates?.[selectedNpcId];
      const messages = chatLogs[selectedNpcId] || [];

      return (
        <div className="h-screen flex flex-col max-w-7xl mx-auto p-3 gap-3">
          {toast && <div className="fixed top-4 right-4 z-50 px-4 py-3 rounded-lg bg-red-600 text-white text-sm pixel-box">{toast}</div>}

          <header className="bg-amber-200 rounded-xl px-5 py-3 flex flex-wrap items-center justify-between gap-4 pixel-box">
            <div className="flex items-center gap-3">
              <button onClick={() => setSession(null)} className="text-xs px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-slate-900 font-bold pixel-btn">
                ← 返回大厅
              </button>
              <div>
                <h1 className="font-black text-slate-900 text-base">{cfg.title}</h1>
                <p className="text-xs font-bold text-slate-700">📅 打卡第 {session.currentTurn} / {cfg.maxTurns} 天</p>
              </div>
            </div>

            <div className="flex items-center gap-2.5">
              <button onClick={() => triggerManagerAction("RED_PACKET")} className="text-xs px-3 py-2 rounded-lg bg-rose-400 hover:bg-rose-300 text-white font-bold pixel-btn">
                💸 发红包(-¥1000)
              </button>
              <button onClick={() => triggerManagerAction("TEAM_DINNER")} className="text-xs px-3 py-2 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-bold pixel-btn">
                🍕 团建消谣(-¥2500)
              </button>
            </div>

            <div className="flex items-center gap-5 flex-1 max-w-sm">
              <div className="flex-1">
                <div className="flex justify-between text-xs font-bold mb-1">
                  <span>项目进度</span>
                  <span className="text-emerald-800">{progress}%</span>
                </div>
                <div className="h-3.5 bg-white border-2 border-slate-900 rounded-full overflow-hidden">
                  <div className={`h-full transition-all duration-300 ${progress >= 99 ? "bg-amber-500" : "bg-emerald-500"}`} style={{ width: `${Math.min(100, progress)}%` }} />
                </div>
              </div>
              <div className="text-right bg-white px-3 py-1 rounded-lg border-2 border-slate-900">
                <div className="text-[10px] font-bold text-slate-500">部门经费</div>
                <div className="text-sm font-black text-amber-700">¥{budget.toLocaleString()}</div>
              </div>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 min-h-0">
            {/* Left: Employee Badge Wall */}
            <aside className="lg:col-span-3 bg-white rounded-xl p-3 overflow-y-auto space-y-2.5 pixel-box">
              <div className="text-xs font-black text-slate-700 uppercase px-1">🪪 员工工牌墙（点击私聊）</div>
              {cfg.npcs.map(npc => {
                const st = session.npcStates?.[npc.npcId];
                const trust = st?.stats?.trust ?? 50;
                const pressure = st?.stats?.pressure ?? 0;
                const isSelected = npc.npcId === selectedNpcId;
                const isDead = st && !st.active;

                return (
                  <div
                    key={npc.npcId}
                    onClick={() => setSelectedNpcId(npc.npcId)}
                    className={`p-3 rounded-lg border-2 border-slate-900 cursor-pointer transition ${
                      isDead ? "opacity-50 bg-slate-200" :
                      isSelected ? "bg-amber-100 shadow-[3px_3px_0px_#0f172a]" : "bg-slate-50 hover:bg-amber-50"
                    } ${!isDead && pressure >= 80 ? "pulse-danger" : ""}`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">{AVATAR_EMOJI[npc.avatarTag] || "🧑"}</span>
                        <div>
                          <div className="text-sm font-black text-slate-900">{npc.name}</div>
                          <div className="text-xs font-medium text-slate-600">{npc.role}</div>{intentMap[npc.npcId] && <div className="text-[10px] text-rose-700 font-bold mt-0.5">意图: {intentMap[npc.npcId]}</div>}
                        </div>
                      </div>
                      {isDead && <span className="text-xs px-2 py-0.5 bg-red-600 text-white font-bold rounded">已离职</span>}
                    </div>
                    <div className="space-y-1.5 text-xs font-bold">
                      <div>
                        <div className="flex justify-between text-slate-600 mb-0.5"><span>信任度</span><span>{trust}</span></div>
                        <div className="h-2 bg-white border border-slate-900 rounded-full overflow-hidden"><div className="h-full bg-sky-500" style={{ width: `${trust}%` }} /></div>
                      </div>
                      <div>
                        <div className="flex justify-between text-slate-600 mb-0.5"><span>压力值</span><span className={pressure >= 80 ? "text-red-600" : ""}>{pressure}</span></div>
                        <div className="h-2 bg-white border border-slate-900 rounded-full overflow-hidden"><div className={`h-full ${pressure >= 80 ? "bg-red-500" : "bg-amber-400"}`} style={{ width: `${pressure}%` }} /></div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </aside>

            {/* Center: Daytime Pixel Office + WeChat Style Group Chat */}
            <main className="lg:col-span-6 bg-[#ededed] rounded-xl flex flex-col min-h-0 pixel-box overflow-hidden">
              <div className="px-4 py-2.5 bg-white border-b-2 border-slate-900 flex items-center gap-2">
                <span className="text-lg">{AVATAR_EMOJI[activeNpc?.avatarTag] || "🧑"}</span>
                <div>
                  <div className="text-sm font-black text-slate-900">💬 私聊：{activeNpc?.name}（{activeNpc?.role}）</div>
                  <div className="text-xs text-slate-500 truncate max-w-md">{activeNpc?.personaPrompt}</div>
                </div>
              </div>

              {cfg.hellMode && progress === 99 && (
                <div className="px-4 py-2 bg-rose-500 text-white text-xs font-bold border-b-2 border-slate-900">
                  ⚠️ 进度卡在 99% 验收地狱！快去说服【铁面王】或【甲方李总】完成终极验收问答才能突破 100%！
                </div>
              )}

              <PixelOfficeStage npcs={cfg.npcs} npcStates={session.npcStates} lastActionMap={lastActionMap} selectedNpcId={selectedNpcId} progress={progress} fxTrigger={fxTrigger} />

              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {messages.length === 0 && (
                  <div className="text-center text-slate-500 text-sm mt-8 font-medium">
                    选好话术、发红包或直接发微信，看看 {activeNpc?.name} 今天准备干活还是摸鱼。
                  </div>
                )}
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex flex-col ${m.role === "player" ? "items-end" : "items-start"}`}>
                    <div className={`max-w-[85%] rounded-xl px-4 py-2.5 text-sm border-2 border-slate-900 ${
                      m.role === "player" ? "bg-[#95ec69] text-slate-900 font-medium" : "bg-white text-slate-900"
                    }`}>
                      {m.text}
                    </div>
                    {m.role === "npc" && (
                      <div className="mt-1.5 space-y-1 max-w-[85%]">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-xs px-2 py-0.5 rounded bg-slate-900 text-amber-300 font-bold">
                            {ACTION_LABELS[m.action] || m.action}
                          </span>
                          {m.thought && (
                            <button onClick={() => setExpandedThoughts(p => ({ ...p, [idx]: !p[idx] }))} className="text-xs text-slate-600 hover:text-slate-900 underline font-medium">
                              {expandedThoughts[idx] ? "收起内心OS" : "偷看内心OS"}
                            </button>
                          )}
                        </div>
                        {expandedThoughts[idx] && (
                          <div className="text-xs text-slate-700 bg-amber-50 border border-slate-900 rounded-lg px-2.5 py-1.5 italic">
                            💭 {m.thought}
                          </div>
                        )}
                        {m.overridden && (
                          <div className="text-xs bg-rose-100 border-2 border-rose-600 text-rose-800 font-bold rounded-lg px-2.5 py-1.5">
                            ⚖️ 规则引擎拦截：{m.overrideReason}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>

              <div className="p-3 bg-white border-t-2 border-slate-900 space-y-2">
                <div className="text-[11px] font-black text-slate-700">🃏 本回合手牌（点击出牌给 {activeNpc?.name}，支持连招 Combo！）</div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {hand.map(c => (
                    <button
                      key={c.id}
                      disabled={sending || !activeNpcState?.active}
                      onClick={() => playCard(c)}
                      className="text-left p-2 rounded-lg bg-amber-50 hover:bg-amber-200 border-2 border-slate-900 pixel-btn disabled:opacity-40"
                    >
                      <div className="flex justify-between items-center text-xs font-black text-slate-900">
                        <span>{c.name}</span>
                        <span className="text-[10px] px-1 bg-slate-900 text-amber-300 rounded">{c.cost}</span>
                      </div>
                      <div className="text-[10px] text-slate-600 mt-1 leading-tight">{c.desc}</div>
                    </button>
                  ))}
                </div>
                <div className="flex flex-wrap gap-2">
                  {quickReplies.map((qr, i) => (
                    <button
                      key={i}
                      title={qr.text}
                      disabled={sending || !activeNpcState?.active}
                      onClick={() => sendMessage(qr.text)}
                      className="text-xs px-2.5 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-slate-900 font-bold border border-slate-900 disabled:opacity-40"
                    >
                      {qr.label}：{qr.text.slice(0, 12)}{qr.text.length > 12 ? "..." : ""}
                    </button>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={inputText}
                    disabled={sending || !activeNpcState?.active}
                    onChange={e => setInputText(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && sendMessage()}
                    placeholder={activeNpcState?.active ? `给 ${activeNpc?.name} 发消息...` : "该同事已离职，请切换其他队友"}
                    className="flex-1 bg-slate-50 border-2 border-slate-900 rounded-lg px-4 py-2 text-sm text-slate-900 focus:outline-none disabled:opacity-50"
                  />
                  <button
                    disabled={sending || !activeNpcState?.active}
                    onClick={() => sendMessage()}
                    className="px-5 py-2 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black text-sm pixel-btn disabled:opacity-50"
                  >
                    {sending ? "输入中..." : "发送"}
                  </button>
                </div>
              </div>
            </main>

            {/* Right: Sticky Note Bulletin Board */}
            <aside className="lg:col-span-3 bg-amber-50 rounded-xl p-3 overflow-y-auto pixel-box">
              <div className="text-xs font-black text-slate-800 uppercase mb-2 px-1">📌 办公室八卦公告栏</div>
              <div className="space-y-2">
                {eventLogs.map((log, i) => (
                  <div key={i} className="text-xs bg-[#fef9c3] border-2 border-slate-900 rounded-lg p-2.5 text-slate-900 font-medium leading-relaxed shadow-[2px_2px_0px_#0f172a]">
                    {log}
                  </div>
                ))}
              </div>
            </aside>
          </div>

          {crisis && session.status === "RUNNING" && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
              <div className="bg-amber-50 rounded-xl max-w-md w-full p-6 pixel-box">
                <h3 className="text-lg font-black text-rose-700 mb-2">{crisis.title}</h3>
                <p className="text-sm text-slate-700 font-medium mb-5">{crisis.desc}</p>
                <div className="space-y-2.5">
                  {crisis.options.map((opt, oi) => (
                    <button
                      key={oi}
                      onClick={() => triggerManagerAction("CRISIS_CHOICE", opt.deltas)}
                      className="w-full text-left px-4 py-3 rounded-lg bg-white hover:bg-amber-200 text-sm text-slate-900 font-bold pixel-btn"
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {session.status !== "RUNNING" && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl max-w-md w-full p-6 text-center pixel-box">
                <div className="text-4xl mb-3">{session.status === "WON" ? "🎉" : "💥"}</div>
                <h2 className="text-2xl font-black text-slate-900 mb-2">
                  {session.status === "WON" ? "项目成功上线！" : "团队彻底散伙了"}
                </h2>
                <p className="text-sm text-slate-700 font-medium mb-5">{session.endReason}</p>
                <div className="flex justify-center gap-3">
                  <button onClick={() => startLevel(cfg.levelId)} className="px-5 py-2.5 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-bold text-sm pixel-btn">
                    再玩一局
                  </button>
                  <button onClick={() => setSession(null)} className="px-5 py-2.5 rounded-lg bg-amber-200 hover:bg-amber-100 text-slate-900 font-bold text-sm pixel-btn">
                    返回大厅
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
