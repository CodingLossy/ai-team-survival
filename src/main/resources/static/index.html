<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 测谎审讯室：CRT 监控终端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #020503;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(16, 185, 129, 0.04) 0px,
        rgba(16, 185, 129, 0.04) 1px,
        transparent 1px,
        transparent 3px
      );
      color: #d1fae5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .danger-vignette { box-shadow: inset 0 0 90px rgba(239, 68, 68, 0.55); }
    .rec-blink { animation: recBlink 1s infinite; }
    @keyframes recBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ACTION_LABELS = {
      ASK_DETAIL: "[CMD: 细节追问]", BLUFF_EVIDENCE: "[CMD: 抛假证据诈唬]", OPEN_BAG_CHECK: "[CMD: 强制开箱检查]",
      PASS_THROUGH: "[CMD: 勉强放行]", CROSS_CHECK: "[CMD: 交叉核对]", REJECT_OFFER: "[CMD: 撤回 Offer]",
      INTERRUPT_HINT: "[CMD: 证人插话]", ACCIDENTAL_LEAK: "[CMD: 猪队友漏嘴]", PRESSURE_SLAM: "[CMD: 拍桌施压]",
      LOCK_ROOM: "[CMD: 封锁展厅]", ARREST: "[CMD: 当场控制]", SOFT_PERSUADE: "[CMD: 温和套话]", PASS_CLUE_TO_BOSS: "[CMD: 递交破绽]"
    };

    function playTableSlam(success) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(success ? 180 : 95, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.21);
      } catch (e) {}
    }

    function playHeartTick(suspicion) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = suspicion >= 75 ? 110 : 75;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch (e) {}
    }

    function PixelInterrogationStage({ suspicion, lastAction, npcs, selectedNpcId, fxTrigger }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let frame = 0;
        let raf;
        const particles = [];
        if (fxTrigger?.ts) {
          const isSlam = fxTrigger.type === "SLAM_HIT" || fxTrigger.type === "SLAM_MISS";
          const col = fxTrigger.type === "SLAM_HIT" ? "#34d399" : (fxTrigger.type === "SLAM_MISS" ? "#ef4444" : "#34d399");
          for (let i = 0; i < (isSlam ? 32 : 16); i++) {
            particles.push({
              x: 240 + (Math.random() - 0.5) * 60,
              y: 78,
              vx: (Math.random() - 0.5) * 6,
              vy: -1.5 - Math.random() * 4,
              size: 4 + Math.floor(Math.random() * 3),
              color: col,
              life: 36
            });
          }
        }

        const drawRect = (x, y, w, h, color) => {
          ctx.fillStyle = color;
          ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        };

        const render = () => {
          frame++;
          ctx.imageSmoothingEnabled = false;
          const burstActive = fxTrigger?.ts && (Date.now() - fxTrigger.ts < 550);
          const shake = ((lastAction === "PRESSURE_SLAM" && frame % 12 < 6) || burstActive) ? (frame % 4 < 2 ? 4 : -4) : 0;

          drawRect(0, 0, 480, 116, "#020604");
          drawRect(16, 12, 448, 70, "#05140c");
          const alarmOn = suspicion >= 80 && (frame % 20 < 10);
          drawRect(428, 18, 12, 12, alarmOn ? "#ef4444" : "#064e3b");

          const swing = Math.round(Math.sin(frame * 0.05) * 4);
          drawRect(238 + swing, 0, 4, 16, "#10b981");
          drawRect(226 + swing, 14, 28, 8, "#065f46");
          ctx.fillStyle = "rgba(16, 185, 129, 0.08)";
          ctx.beginPath();
          ctx.moveTo(228 + swing, 22);
          ctx.lineTo(252 + swing, 22);
          ctx.lineTo(320 + swing, 92);
          ctx.lineTo(160 + swing, 92);
          ctx.closePath();
          ctx.fill();

          npcs.slice(0, 2).forEach((npc, idx) => {
            const nx = (npcs.length === 1 ? 228 : 178 + idx * 100) + shake;
            const ny = 42 + (Math.floor(frame / 20 + idx) % 2);
            const isSel = npc.npcId === selectedNpcId;
            drawRect(nx, ny, 20, 18, "#d1fae5");
            drawRect(nx, ny - 4, 20, 6, "#064e3b");
            drawRect(nx + 4, ny + 7, 3, 3, "#020604");
            drawRect(nx + 13, ny + 7, 3, 3, "#020604");
            drawRect(nx - 4, ny + 18, 28, 22, isSel ? "#059669" : "#065f46");
          });

          drawRect(40, 82 + shake, 400, 34, "#064e3b");
          drawRect(40, 82 + shake, 400, 3, "#10b981");

          drawRect(64, 62 + shake, 48, 24, "#022c22");
          drawRect(68, 66 + shake, 40, 16, "#020604");
          const needleY = 74 + Math.round(Math.sin(frame * (suspicion >= 75 ? 0.5 : 0.2)) * (suspicion >= 75 ? 6 : 3));
          drawRect(70 + (frame % 36), needleY + shake, 3, 3, suspicion >= 75 ? "#ef4444" : "#34d399");

          for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vy += 0.18;
            pt.life--;
            drawRect(pt.x, pt.y, pt.size, pt.size, pt.color);
            if (pt.life <= 0) particles.splice(i, 1);
          }

          raf = requestAnimationFrame(render);
        };
        raf = requestAnimationFrame(render);
        return () => cancelAnimationFrame(raf);
      }, [suspicion, lastAction, npcs, selectedNpcId, fxTrigger]);

      return (
        <div className="p-2 bg-black border-b border-emerald-500/40 relative">
          <div className="absolute top-3 left-4 text-[10px] text-red-500 font-bold rec-blink">● REC // CAM-04</div>
          <canvas ref={canvasRef} width={480} height={116} className="w-full h-28 border border-emerald-500/30" style={{ imageRendering: "pixelated" }} />
        </div>
      );
    }

    function App() {
      const [levels, setLevels] = useState([]);
      const [customIdea, setCustomIdea] = useState("");
      const [compiling, setCompiling] = useState(false);
      const [session, setSession] = useState(null);
      const [selectedNpcId, setSelectedNpcId] = useState(null);
      const [chatLogs, setChatLogs] = useState([]);
      const [inputText, setInputText] = useState("");
      const [sending, setSending] = useState(false);
      const [showSecret, setShowSecret] = useState(true);
      const [toast, setToast] = useState(null);
      const [timeLeft, setTimeLeft] = useState(18);
      const [lastAction, setLastAction] = useState("ASK_DETAIL");
      const [fxTrigger, setFxTrigger] = useState(null);
      const [itemsLeft, setItemsLeft] = useState({ water: 2, alibi: 1, blame: 1 });
      const [quickReplies, setQuickReplies] = useState([
        { label: "强硬反问", text: "这只是我的私人物品，你们有什么依据怀疑我？" },
        { label: "模糊拖延", text: "时间有点久了，具体细节我得稍微回忆一下。" }
      ]);

      const [sensorMode, setSensorMode] = useState("AUTO");
      const [mediaReady, setMediaReady] = useState(false);
      const [calibrating, setCalibrating] = useState(false);
      const [calibrated, setCalibrated] = useState(false);
      const [listening, setListening] = useState(false);

      const videoRef = useRef(null);
      const canvasWaveRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const streamRef = useRef(null);
      const turnStartRef = useRef(Date.now());
      const volumeSamplesRef = useRef([]);
      const baselineVolRef = useRef(20);
      const animFrameRef = useRef(null);
      const recognitionRef = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        fetch("/api/levels")
          .then(r => r.json())
          .then(data => {
            const filtered = data.filter(l => l.gameType === "INTERROGATION");
            setLevels(filtered.length > 0 ? filtered : data);
          })
          .catch(e => showToast("SYS_ERR: " + e.message));
        return () => stopMedia();
      }, []);

      useEffect(() => {
        if (!session || session.status !== "RUNNING" || sending) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) return 0;
            if (prev <= 6) playHeartTick(session.globalStats?.suspicion ?? 0);
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [session, sending]);

      const stopMedia = () => {
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (audioCtxRef.current) {
          audioCtxRef.current.close().catch(() => {});
          audioCtxRef.current = null;
        }
        setMediaReady(false);
      };

      const initSensors = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          streamRef.current = stream;
          if (videoRef.current) videoRef.current.srcObject = stream;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          source.connect(analyser);
          audioCtxRef.current = ctx;
          analyserRef.current = analyser;
          setMediaReady(true);
          setSensorMode("AUTO");
          drawWaveform();
        } catch (err) {
          setSensorMode("TEXT_ONLY");
          setMediaReady(false);
        }
      };

      const drawWaveform = () => {
        if (!analyserRef.current || !canvasWaveRef.current) return;
        const canvas = canvasWaveRef.current;
        const ctx = canvas.getContext("2d");
        const bufferLen = analyserRef.current.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLen);
        const render = () => {
          animFrameRef.current = requestAnimationFrame(render);
          analyserRef.current.getByteTimeDomainData(dataArray);
          let sum = 0;
          for (let i = 0; i < bufferLen; i++) sum += Math.abs(dataArray[i] - 128);
          const avgVol = sum / bufferLen;
          volumeSamplesRef.current.push(avgVol);
          if (volumeSamplesRef.current.length > 60) volumeSamplesRef.current.shift();

          ctx.fillStyle = "#020604";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = avgVol > baselineVolRef.current * 1.5 ? "#ef4444" : "#10b981";
          ctx.beginPath();
          const sliceWidth = canvas.width / bufferLen;
          let x = 0;
          for (let i = 0; i < bufferLen; i++) {
            const v = dataArray[i] / 128.0;
            const y = (v * canvas.height) / 2;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += sliceWidth;
          }
          ctx.lineTo(canvas.width, canvas.height / 2);
          ctx.stroke();
        };
        render();
      };

      const runCalibration = () => {
        setCalibrating(true);
        volumeSamplesRef.current = [];
        setTimeout(() => {
          const samples = volumeSamplesRef.current;
          if (samples.length > 0) {
            const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
            baselineVolRef.current = Math.max(4, avg);
          }
          setCalibrating(false);
          setCalibrated(true);
          turnStartRef.current = Date.now();
          setTimeLeft(18);
        }, 3000);
      };

      const toggleVoiceInput = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return showToast("当前浏览器不支持语音听写");
        if (listening && recognitionRef.current) {
          recognitionRef.current.stop();
          setListening(false);
          return;
        }
        const rec = new SpeechRec();
        rec.lang = "zh-CN";
        rec.interimResults = false;
        rec.onresult = (e) => setInputText(prev => prev + e.results[0][0].transcript);
        rec.onend = () => setListening(false);
        rec.onerror = () => setListening(false);
        recognitionRef.current = rec;
        setListening(true);
        rec.start();
      };

      const startLevel = async (levelId) => {
        try {
          const res = await fetch(`/api/session/start?levelId=${encodeURIComponent(levelId)}`, { method: "POST" });
          if (!res.ok) throw new Error("BOOT_FAILED");
          const data = await res.json();
          setSession(data);
          const firstNpc = data.levelConfig.npcs[0];
          setSelectedNpcId(firstNpc?.npcId || null);
          setChatLogs([{
            role: "npc",
            npcName: firstNpc?.name,
            text: `坐下吧。关于「${data.levelConfig.title}」，你最好老实交代。`,
            action: "ASK_DETAIL"
          }]);
          setItemsLeft({ water: 2, alibi: 1, blame: 1 });
          setCalibrated(false);
          setTimeLeft(18);
          turnStartRef.current = Date.now();
          initSensors();
        } catch (e) {
          showToast(e.message);
        }
      };

      const handleCompileCustom = async () => {
        if (!customIdea.trim()) return showToast("INPUT_REQUIRED");
        setCompiling(true);
        try {
          const res = await fetch("/api/levels/compile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ gameType: "INTERROGATION", idea: customIdea.trim() })
          });
          if (!res.ok) throw new Error("COMPILE_FAILED");
          const compiled = await res.json();
          setLevels(prev => [compiled, ...prev]);
          setCustomIdea("");
          await startLevel(compiled.levelId);
        } catch (e) {
          showToast(e.message);
        } finally {
          setCompiling(false);
        }
      };

      const useTacticItem = async (key, actionType) => {
        if (!session || itemsLeft[key] <= 0 || session.status !== "RUNNING") return;
        setItemsLeft(prev => ({ ...prev, [key]: prev[key] - 1 }));
        if (key === "water") setTimeLeft(18);
        try {
          const res = await fetch("/api/session/action", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: session.sessionId, actionType })
          });
          const data = await res.json();
          if (data.session) setSession(data.session);
          if (data.log) setChatLogs(prev => [...prev, { role: "system", text: data.log }]);
        } catch (e) {
          showToast("ACTION_FAILED");
        }
      };

      const callOutBluff = () => {
        if (!session || session.status !== "RUNNING") return;
        fetch("/api/session/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: session.sessionId, actionType: "CALL_OUT_BLUFF" })
        }).then(r => r.json()).then(d => {
          if (d.session) setSession(d.session);
          if (d.log) {
            setChatLogs(prev => [...prev, { role: "system", text: d.log }]);
            const hit = d.log.includes("成功");
            setFxTrigger({ type: hit ? "SLAM_HIT" : "SLAM_MISS", ts: Date.now() });
            playTableSlam(hit);
          }
        });
      };

      const sendReply = async (textOverride) => {
        const msg = (textOverride ?? inputText).trim();
        if (!msg || !session || !selectedNpcId || sending || session.status !== "RUNNING") return;

        const pauseSec = Number(((Date.now() - turnStartRef.current) / 1000).toFixed(1));
        const samples = volumeSamplesRef.current;
        const avgVol = samples.length ? samples.reduce((a, b) => a + b, 0) / samples.length : baselineVolRef.current;
        const tremor = sensorMode === "AUTO" && mediaReady && (avgVol < baselineVolRef.current * 0.5 || avgVol > baselineVolRef.current * 2.5);
        const blink = sensorMode === "AUTO" && mediaReady && timeLeft === 0;

        const currentSensors = { blinkSpike: blink, pauseSeconds: pauseSec, voiceTremor: tremor };
        const targetNpc = session.levelConfig.npcs.find(n => n.npcId === selectedNpcId);
        setSending(true);
        if (!textOverride) setInputText("");
        setChatLogs(prev => [...prev, { role: "player", text: msg }]);

        try {
          const res = await fetch("/api/session/interact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: session.sessionId, targetNpcId: selectedNpcId, message: msg, sensors: currentSensors })
          });
          if (!res.ok) throw new Error("API_ERR");
          const data = await res.json();
          if (data.session) setSession(data.session);

          if (data.decision) {
            setLastAction(data.validation?.executedAction || data.decision.intentAction);
            setChatLogs(prev => [...prev, {
              role: "npc",
              npcName: targetNpc?.name,
              text: data.decision.dialogue,
              action: data.validation?.executedAction || data.decision.intentAction,
              hooks: data.validation?.triggeredHooks || []
            }]);
            if (data.decision.suggestedReplies?.length) setQuickReplies(data.decision.suggestedReplies);
          }
          setTimeLeft(18);
          turnStartRef.current = Date.now();
        } catch (e) {
          showToast(e.message);
        } finally {
          setSending(false);
        }
      };

      if (!session) {
        return (
          <div className="max-w-5xl mx-auto px-4 py-10">
            {toast && <div className="fixed top-4 right-4 z-50 px-4 py-2 border border-red-500 bg-black text-red-400 text-xs">{toast}</div>}
            <div className="border border-emerald-500/40 bg-emerald-950/20 p-6 mb-8">
              <div className="text-xs text-emerald-400 mb-2">POLYGRAPH_OS v3.2 // CLASSIFIED TERMINAL</div>
              <h1 className="text-3xl font-bold text-emerald-300 tracking-wider mb-2">🚨 AI 测谎审讯室：千万别眨眼</h1>
              <p className="text-xs text-emerald-400/70">双盲情报对照 · 微表情与声纹监控 · 拍桌拆穿假证据反杀</p>
            </div>

            <div className="border border-emerald-500/30 bg-black/70 p-5 mb-8">
              <div className="text-xs text-emerald-400 mb-2">[+] CUSTOM_CASE_COMPILER // AI 一句话生成机密案卷</div>
              <div className="flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={customIdea}
                  onChange={e => setCustomIdea(e.target.value)}
                  placeholder="输入脑洞案情，例如：我偷偷穿脏了老板的限量球鞋，现在要骗过洁癖老板"
                  className="flex-1 bg-black border border-emerald-500/40 px-4 py-2.5 text-xs text-emerald-200 focus:outline-none focus:border-emerald-400"
                />
                <button
                  onClick={handleCompileCustom}
                  disabled={compiling}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs disabled:opacity-50"
                >
                  {compiling ? "COMPILING..." : "COMPILE & ENTER >"}
                </button>
              </div>
            </div>

            <div className="text-xs text-emerald-400 mb-3">[=] CASE_ARCHIVE // 选择审讯案卷（共 {levels.length} 宗）</div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {levels.map(lvl => (
                <div key={lvl.levelId} className="border border-emerald-500/30 hover:border-emerald-400 bg-black/80 p-4 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between text-[11px] text-emerald-500 mb-2">
                      <span>TURNS: {lvl.maxTurns}</span>
                      <span>NPC: {lvl.npcs?.length || 1}</span>
                    </div>
                    <h3 className="text-sm font-bold text-emerald-200 mb-2">{lvl.title}</h3>
                    <p className="text-xs text-emerald-400/70 mb-4 leading-relaxed">{lvl.description}</p>
                  </div>
                  <button
                    onClick={() => startLevel(lvl.levelId)}
                    className="w-full py-2 border border-emerald-500 text-emerald-300 hover:bg-emerald-500 hover:text-black text-xs font-bold transition"
                  >
                    LOAD_INTERROGATION &gt;
                  </button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const cfg = session.levelConfig;
      const suspicion = session.globalStats?.suspicion ?? 0;

      return (
        <div className={`h-screen flex flex-col max-w-7xl mx-auto p-3 gap-3 ${suspicion >= 80 ? "danger-vignette" : ""}`}>
          {toast && <div className="fixed top-4 right-4 z-50 px-4 py-2 border border-amber-500 bg-black text-amber-300 text-xs">{toast}</div>}

          <header className="border border-emerald-500/40 bg-black/90 px-4 py-2.5 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <button onClick={() => { stopMedia(); setSession(null); }} className="text-xs px-3 py-1 border border-emerald-500/50 text-emerald-400 hover:bg-emerald-500 hover:text-black">
                [ESC] 退出
              </button>
              <div>
                <div className="text-sm font-bold text-emerald-300">{cfg.title}</div>
                <div className="text-xs text-emerald-500">ROUND {session.currentTurn}/{cfg.maxTurns} · TIMER: <span className={timeLeft <= 5 ? "text-red-500 font-bold" : "text-amber-400"}>{timeLeft}s</span></div>
              </div>
            </div>

            <div className="flex-1 max-w-sm">
              <div className="flex justify-between text-xs mb-1">
                <span className="text-emerald-400">POLYGRAPH_SUSPICION</span>
                <span className={`font-bold ${suspicion >= 80 ? "text-red-500" : "text-emerald-300"}`}>{suspicion}%</span>
              </div>
              <div className="h-2.5 bg-black border border-emerald-500/50">
                <div className={`h-full transition-all duration-300 ${suspicion >= 80 ? "bg-red-500" : "bg-emerald-400"}`} style={{ width: `${Math.min(100, suspicion)}%` }} />
              </div>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 min-h-0">
            {/* Left: Classified Dossier + Polygraph Feed */}
            <aside className="lg:col-span-5 flex flex-col gap-3 min-h-0 overflow-y-auto">
              <div className="bg-[#1c1917] border border-amber-600/60 p-3.5">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-xs font-bold text-amber-400">[TOP SECRET // 你的秘密底牌与口供]</span>
                  <button onClick={() => setShowSecret(!showSecret)} className="text-xs text-amber-500 underline">{showSecret ? "FOLD" : "OPEN"}</button>
                </div>
                {showSecret && (
                  <div className="space-y-1.5">
                    <p className="text-xs text-amber-100/90 leading-relaxed">{cfg.secretTruth}</p>
                    {cfg.playerCards?.length > 0 && (
                      <div className="space-y-1 pt-1.5 border-t border-amber-600/30">
                        {cfg.playerCards.map((c, ci) => (
                          <div key={ci} className="text-xs bg-black/60 text-amber-200 px-2 py-1 border-l-2 border-amber-500">{c}</div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div className="border border-emerald-500/30 bg-black/80 p-3 space-y-2">
                <button onClick={callOutBluff} className="w-full py-2 bg-red-950/60 hover:bg-red-900/70 border border-red-500 text-red-300 text-xs font-bold">
                  [!] 拍桌拆穿：你在用假证据诈我！（猜对 -30% / 猜错 +20%）
                </button>
                <div className="grid grid-cols-3 gap-2">
                  <button disabled={itemsLeft.water <= 0} onClick={() => useTacticItem("water", "DRINK_WATER")} className="py-1.5 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-950 text-xs disabled:opacity-30">
                    🥤 喝水({itemsLeft.water})
                  </button>
                  <button disabled={itemsLeft.alibi <= 0} onClick={() => useTacticItem("alibi", "ALIBI_CARD")} className="py-1.5 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-950 text-xs disabled:opacity-30">
                    📄 伪证({itemsLeft.alibi})
                  </button>
                  <button disabled={itemsLeft.blame <= 0} onClick={() => useTacticItem("blame", "BLAME_WITNESS")} className="py-1.5 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-950 text-xs disabled:opacity-30">
                    🎭 甩锅({itemsLeft.blame})
                  </button>
                </div>
              </div>

              <div className="border border-emerald-500/30 bg-black/80 p-3 flex-1 flex flex-col gap-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="text-emerald-400">{sensorMode === "AUTO" && mediaReady ? "SENSOR: ONLINE" : "MODE: TEXT_ONLY"}</span>
                  <button onClick={() => sensorMode === "AUTO" ? (stopMedia(), setSensorMode("TEXT_ONLY")) : initSensors()} className="px-2 py-0.5 border border-emerald-500/40 text-emerald-400">
                    {sensorMode === "AUTO" ? "切纯文字" : "开传感器"}
                  </button>
                </div>
                <div className="relative bg-black border border-emerald-500/30 h-32 flex items-center justify-center overflow-hidden">
                  <video ref={videoRef} autoPlay playsInline muted className={`w-full h-full object-cover opacity-80 ${mediaReady ? "" : "hidden"}`} />
                  {!mediaReady && <div className="text-xs text-emerald-600 text-center px-4">NO_CAMERA // 降级为纯文本停顿监测</div>}
                  {mediaReady && !calibrated && (
                    <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center p-3 text-center">
                      <p className="text-xs text-emerald-300 mb-2">CALIBRATE: 朗读“我已准备好接受询问”</p>
                      <button onClick={runCalibration} disabled={calibrating} className="px-3 py-1 bg-emerald-600 text-black text-xs font-bold">
                        {calibrating ? "CALIBRATING..." : "START 3s BASELINE"}
                      </button>
                    </div>
                  )}
                </div>
                <canvas ref={canvasWaveRef} width={400} height={48} className="w-full h-12 border border-emerald-500/30 bg-black" />
              </div>
            </aside>

            {/* Right: Pixel Stage + Official Transcript Log */}
            <main className="lg:col-span-7 border border-emerald-500/40 bg-black/90 flex flex-col min-h-0">
              <div className="px-3 py-2 border-b border-emerald-500/30 flex flex-wrap gap-2">
                {cfg.npcs.map(npc => {
                  const st = session.npcStates?.[npc.npcId];
                  const active = npc.npcId === selectedNpcId;
                  return (
                    <button
                      key={npc.npcId}
                      onClick={() => setSelectedNpcId(npc.npcId)}
                      className={`px-3 py-1 text-xs border ${active ? "bg-emerald-500 text-black font-bold border-emerald-400" : "border-emerald-500/40 text-emerald-400"}`}
                    >
                      {npc.name} ({npc.role}) · PATIENCE:{st?.stats?.patience ?? 70}
                    </button>
                  );
                })}
              </div>

              <PixelInterrogationStage suspicion={suspicion} lastAction={lastAction} npcs={cfg.npcs} selectedNpcId={selectedNpcId} fxTrigger={fxTrigger} />

              <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
                {chatLogs.map((m, idx) => (
                  <div key={idx} className={`p-2.5 border-l-2 ${
                    m.role === "player" ? "border-sky-400 bg-sky-950/20 text-sky-200" :
                    m.role === "system" ? "border-amber-400 bg-amber-950/20 text-amber-300" :
                    "border-emerald-500 bg-emerald-950/20 text-emerald-100"
                  }`}>
                    <div className="font-bold mb-1">
                      {m.role === "player" ? "[SUSPECT_YOU] >>" : m.role === "system" ? "[SYS_LOG] >>" : `[${m.npcName}] >>`}
                    </div>
                    <div className="leading-relaxed text-sm">{m.text}</div>
                    {m.role === "npc" && (
                      <div className="mt-1.5 flex flex-wrap gap-2">
                        {m.action && <span className="px-1.5 py-0.5 bg-emerald-950 border border-emerald-500/40 text-amber-300">{ACTION_LABELS[m.action] || m.action}</span>}
                        {m.hooks?.map((h, hi) => <span key={hi} className="px-1.5 py-0.5 bg-red-950 border border-red-500 text-red-300">ALERT: {h}</span>)}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div className="p-3 border-t border-emerald-500/30 space-y-2">
                <div className="flex flex-wrap gap-2">
                  <button onClick={toggleVoiceInput} className={`text-xs px-2.5 py-1 border ${listening ? "bg-red-600 text-white border-red-400" : "border-emerald-500/40 text-emerald-400"}`}>
                    {listening ? "🎙️ REC..." : "🎙️ VOICE"}
                  </button>
                  {quickReplies.map((qr, qi) => (
                    <button key={qi} disabled={sending} title={qr.text} onClick={() => sendReply(qr.text)} className="text-xs px-2.5 py-1 border border-emerald-500/40 text-emerald-200 hover:bg-emerald-950 disabled:opacity-40">
                      [{qr.label}] {qr.text.slice(0, 14)}{qr.text.length > 14 ? "..." : ""}
                    </button>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={inputText}
                    disabled={sending}
                    onChange={e => setInputText(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && sendReply()}
                    placeholder="> 输入你的辩解..."
                    className="flex-1 bg-black border border-emerald-500/50 px-3 py-2 text-sm text-emerald-200 focus:outline-none focus:border-emerald-400"
                  />
                  <button disabled={sending} onClick={() => sendReply()} className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs disabled:opacity-50">
                    {sending ? "PROCESSING..." : "SUBMIT >"}
                  </button>
                </div>
              </div>
            </main>
          </div>

          {session.status !== "RUNNING" && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
              <div className="bg-black border-2 border-emerald-400 max-w-md w-full p-6 text-center">
                <div className="text-3xl mb-3">{session.status === "WON" ? "[CASE_DISMISSED]" : "[BUSTED]"}</div>
                <h2 className="text-xl font-bold text-emerald-300 mb-2">{session.status === "WON" ? "成功骗过测谎终端！" : "谎言被当场拆穿！"}</h2>
                <p className="text-xs text-emerald-200/80 mb-5">{session.endReason}</p>
                <div className="flex justify-center gap-3">
                  <button onClick={() => startLevel(cfg.levelId)} className="px-5 py-2 bg-emerald-500 text-black font-bold text-xs">RETRY &gt;</button>
                  <button onClick={() => { stopMedia(); setSession(null); }} className="px-5 py-2 border border-emerald-500 text-emerald-300 text-xs">ARCHIVE</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
